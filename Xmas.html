<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Elf RPG - Fixed</title>
    <style>
        /* Full holiday background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background-color: #0a1a3a;
            overflow: hidden;
            height: 100vh;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.6"/></svg>') repeat;
            animation: snowfall 12s linear infinite;
            z-index: -1;
        }

        @keyframes snowfall {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        .lights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 255, 0, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(0, 255, 0, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(255, 0, 0, 0.2) 0%, transparent 50%);
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Screens */
        #start-screen, #game-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 2em;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff0000;
        }

        p {
            margin: 10px 0;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #aaffaa;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #00cc00;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        input[readonly] {
            background: rgba(100, 100, 100, 0.3);
            color: #ffff99;
            font-size: 12px;
        }

        button {
            margin: 10px 5px;
            padding: 12px 30px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        button:hover {
            background: #ff0000;
            transform: scale(1.05);
        }

        #test-btn {
            background: #00aa00;
        }

        #test-btn:hover {
            background: #00cc00;
        }

        /* Game screen */
        #chat-log {
            height: 380px;
            overflow-y: auto;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid #00cc00;
            font-size: 1em;
            line-height: 1.6;
        }

        #user-input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
        }

        #send-btn {
            width: 25%;
            padding: 12px;
            font-size: 16px;
        }

        .message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .user-message {
            background: rgba(0, 200, 0, 0.3);
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 0;
        }

        .ai-message {
            background: rgba(0, 100, 200, 0.3);
            margin-right: auto;
            text-align: left;
            border-bottom-left-radius: 0;
        }

        .error {
            background: rgba(200, 0, 0, 0.5) !important;
            color: #ffff00;
        }

        #stats {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-weight: bold;
            color: #ffcc00;
        }

        #test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .success { background: rgba(0, 170, 0, 0.5); color: #fff; }
        .failure { background: rgba(200, 0, 0, 0.5); color: #ffff00; }

        small {
            font-size: 0.8em;
            color: #aaaa00;
        }

        a {
            color: #00ccff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="lights"></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Christmas Elf RPG - Fixed Proxy</h1>
        <p>It's Christmas Eve at the North Pole, and you're <strong>way behind schedule</strong>! Santa needs <strong>100 gifts</strong> ready before dawn. Can you save Christmas?</p>

        <label for="elf-name">Your Elf Name:</label>
        <input type="text" id="elf-name" placeholder="e.g. Sparkle, Jingle, Frosty">

        <label for="api-key">Google Gemini API Key:</label>
        <input type="text" id="api-key" placeholder="Get free at aistudio.google.com">

        <label for="proxy-url">CORS Proxy URL (updated & fixed):</label>
        <input type="text" id="proxy-url" readonly 
               value="https://api.codetabs.com/v1/proxy?quest=">

        <div id="test-result" style="display: none;"></div>

        <p><small><strong>Tip:</strong> Get your API key at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></small></p>

        <button id="test-btn" onclick="testConnection()">Test Connection</button>
        <button onclick="startGame()">Start Adventure</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" style="display: none;">
        <div id="chat-log"></div>
        <input type="text" id="user-input" placeholder="What do you do next?" onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">Send</button>
        <div id="stats">Loading stats...</div>
    </div>

    <script>
        // Game state
        let elfName = '';
        let apiKey = '';
        let proxyUrl = '';
        let conversationHistory = [];
        let gameState = {
            giftsMade: 0,
            requiredGifts: 100,
            stats: {
                energy: 100,
                skill: 1,
                luck: 1
            }
        };

        // Test connection
        function testConnection() {
            const testKey = document.getElementById('api-key').value.trim();
            if (!testKey) {
                showTestResult('Enter your API key first!', 'failure');
                return;
            }

            const testResult = document.getElementById('test-result');
            testResult.style.display = 'block';
            testResult.textContent = 'Testing...';
            testResult.className = '';

            const testUrl = `${document.getElementById('proxy-url').value}${encodeURIComponent(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${testKey}`)}`;

            fetch(testUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Test' }] }] })
            })
            .then(response => {
                if (response.ok) {
                    showTestResult('Connected! Proxy & API key working. 🎉', 'success');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            })
            .catch(error => {
                let msg = 'Failed: ';
                if (error.message.includes('429')) msg += 'Rate limit—wait 1 min.';
                else if (error.message.includes('401/400')) msg += 'Invalid API key—regenerate.';
                else if (error.name === 'TypeError') msg += 'Network issue—check WiFi or VPN.';
                else msg += error.message;
                showTestResult(msg, 'failure');
            });
        }

        function showTestResult(msg, type) {
            const testResult = document.getElementById('test-result');
            testResult.textContent = msg;
            testResult.className = type;
        }

        // Start the game
        function startGame() {
            elfName = document.getElementById('elf-name').value.trim();
            apiKey = document.getElementById('api-key').value.trim();
            proxyUrl = document.getElementById('proxy-url').value.trim();

            if (!elfName || !apiKey) {
                alert('Please enter your elf name and API key!');
                return;
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // Initial system prompt
            const initialPrompt = `You are the Game Master for a text-based Christmas Elf RPG. 
The player is an elf named ${elfName} at the North Pole on Christmas Eve. 
They are behind schedule and must produce ${gameState.requiredGifts} gifts before Santa leaves.

Track these stats:
- Energy (starts at 100, decreases with actions, recover by resting)
- Skill (starts at 1, increases with successful crafting/quests)
- Luck (starts at 1, increases with lucky events)

Also track: Gifts Made (0 / ${gameState.requiredGifts})

Respond in immersive, holiday-themed narrative. Present choices, challenges, and quests. 
Keep responses under 200 words. End EVERY reply with:

[Stats: Energy: X, Skill: Y, Luck: Z | Gifts Made: A/${gameState.requiredGifts}]

If Gifts Made reaches ${gameState.requiredGifts}, end with a victory message.

Begin the adventure now.`;

            conversationHistory = [
                { role: 'user', parts: [{ text: initialPrompt }] }
            ];

            callGemini();
        }

        // Send player message
        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('You: ' + message, 'user-message');
            input.value = '';

            conversationHistory.push({ role: 'user', parts: [{ text: message }] });
            callGemini();
        }

        // Call Gemini via proxy
        function callGemini() {
            appendMessage('Thinking...', 'ai-message');

            const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const fullUrl = `${proxyUrl}${encodeURIComponent(geminiUrl)}`;

            fetch(fullUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: conversationHistory,
                    generationConfig: {
                        temperature: 0.9,
                        maxOutputTokens: 2048
                    }
                })
            })
            .then(response => {
                if (!response.ok) {
                    const errorText = response.status === 429 ? 'Rate limit—wait 1 min.' : `HTTP ${response.status}`;
                    throw new Error(errorText);
                }
                return response.text(); // Get as text first to handle proxy wrapping
            })
            .then(text => {
                let data;
                try {
                    // If proxy wraps in JSON, parse it
                    const parsed = JSON.parse(text);
                    data = parsed.contents ? parsed : JSON.parse(parsed.contents[0]); // Adjust for proxy response
                } catch {
                    data = JSON.parse(text); // Direct JSON
                }
                const aiResponse = data.candidates[0].content.parts[0].text;
                removeThinking();
                appendMessage(aiResponse, 'ai-message');
                conversationHistory.push({ role: 'model', parts: [{ text: aiResponse }] });

                // Parse stats
                const statsMatch = aiResponse.match(/\[Stats: Energy: (\d+), Skill: (\d+), Luck: (\d+) \| Gifts Made: (\d+)\/\d+\]/);
                if (statsMatch) {
                    gameState.stats.energy = parseInt(statsMatch[1]);
                    gameState.stats.skill = parseInt(statsMatch[2]);
                    gameState.stats.luck = parseInt(statsMatch[3]);
                    gameState.giftsMade = parseInt(statsMatch[4]);
                    updateStatsDisplay();

                    if (gameState.giftsMade >= gameState.requiredGifts) {
                        setTimeout(() => {
                            appendMessage('🎄🎅 CHRISTMAS IS SAVED! All gifts are ready! 🎁✨', 'ai-message');
                            document.getElementById('user-input').disabled = true;
                            document.getElementById('send-btn').disabled = true;
                        }, 500);
                    }
                }
            })
            .catch(error => {
                removeThinking();
                let msg = 'Error: ';
                if (error.message.includes('429')) msg += 'Proxy rate limit—wait 1 min and retry.';
                else if (error.message.includes('401') || error.message.includes('400')) msg += 'Invalid API key—regenerate in AI Studio.';
                else if (error.name === 'TypeError') msg += 'Network/fetch error—check WiFi, disable VPN, or try incognito.';
                else if (error.message.includes('HTTP')) msg += 'Proxy issue—refresh and test connection.';
                else msg += error.message;
                appendMessage(msg, 'ai-message error');
                console.error(error);
            });
        }

        // UI Helpers
        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.textContent = text;
            document.getElementById('chat-log').appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        function removeThinking() {
            const log = document.getElementById('chat-log');
            const last = log.lastChild;
            if (last && last.textContent === 'Thinking...') {
                log.removeChild(last);
            }
        }

        function updateStatsDisplay() {
            document.getElementById('stats').textContent = 
                `Energy: ${gameState.stats.energy} | Skill: ${gameState.stats.skill} | Luck: ${gameState.stats.luck} | Gifts: ${gameState.giftsMade}/${gameState.requiredGifts}`;
        }
    </script>
</body>
</html>
