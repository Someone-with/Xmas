<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Santa</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* Light blue for a festive feel */
        }
        #santa-svg {
            width: 200px;
            height: 300px;
            cursor: pointer;
        }

        /* Bounce animation for the whole Santa */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }
        .bounce {
            animation: bounce 2s ease-in-out;
        }

        /* Laugh animation for the mouth */
        @keyframes laugh {
            0% {
                d: path("M80 120 Q100 140 120 120");
            }
            50% {
                d: path("M70 120 Q100 160 130 120");
            }
            100% {
                d: path("M80 120 Q100 140 120 120");
            }
        }
        #mouth.laugh {
            animation: laugh 1s ease-in-out;
        }

        /* Wave animation for the right arm */
        @keyframes wave {
            0% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(45deg);
            }
            50% {
                transform: rotate(0deg);
            }
            75% {
                transform: rotate(45deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }
        #right-arm.wave {
            transform-origin: 130px 160px;
            animation: wave 2s ease-in-out;
        }

        /* Additional animation: Dance (rotate whole body slightly) */
        @keyframes dance {
            0% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(5deg);
            }
            50% {
                transform: rotate(0deg);
            }
            75% {
                transform: rotate(-5deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }
        .dance {
            animation: dance 2s ease-in-out;
        }
    </style>
</head>
<body>
    <svg id="santa-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Face -->
        <circle cx="100" cy="100" r="50" fill="peachpuff" id="face" />
        
        <!-- Eyes -->
        <circle cx="80" cy="90" r="5" fill="black" />
        <circle cx="120" cy="90" r="5" fill="black" />
        
        <!-- Nose -->
        <circle cx="100" cy="110" r="5" fill="red" id="nose" />
        
        <!-- Mouth -->
        <path id="mouth" d="M80 120 Q100 140 120 120" fill="none" stroke="black" stroke-width="2" />
        
        <!-- Beard -->
        <path d="M50 130 Q100 200 150 130" fill="white" stroke="white" stroke-width="2" id="beard" />
        
        <!-- Hat -->
        <polygon points="50,80 100,30 150,80" fill="red" id="hat" />
        <circle cx="100" cy="30" r="10" fill="white" />
        
        <!-- Body -->
        <rect x="70" y="150" width="60" height="100" fill="red" id="body" />
        
        <!-- Arms -->
        <line id="left-arm" x1="70" y1="160" x2="40" y2="200" stroke="red" stroke-width="20" stroke-linecap="round" />
        <line id="right-arm" x1="130" y1="160" x2="160" y2="200" stroke="red" stroke-width="20" stroke-linecap="round" />
    </svg>

    <script>
        const santa = document.getElementById('santa-svg');
        const mouth = document.getElementById('mouth');
        const rightArm = document.getElementById('right-arm');

        // Array of possible animations
        const animations = [
            () => {
                // Bounce
                santa.classList.add('bounce');
                setTimeout(() => santa.classList.remove('bounce'), 2000);
            },
            () => {
                // Laugh
                mouth.classList.add('laugh');
                setTimeout(() => mouth.classList.remove('laugh'), 1000);
            },
            () => {
                // Wave
                rightArm.classList.add('wave');
                setTimeout(() => rightArm.classList.remove('wave'), 2000);
            },
            () => {
                // Dance
                santa.classList.add('dance');
                setTimeout(() => santa.classList.remove('dance'), 2000);
            }
        ];

        // On click (poke), trigger a random animation
        santa.addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * animations.length);
            animations[randomIndex]();
        });
    </script>
</body>
</html>
