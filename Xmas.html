<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Elf RPG – Fancy Edition</title>

    <style>
        /* Page & Background */
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff; background: #0a0a2a; overflow: hidden; height: 100vh;
        }

        .snow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="2" fill="%23fff" opacity="0.6"/></svg>') repeat;
            animation: fall 12s linear infinite; z-index: -1;
        }
        @keyframes fall { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }

        .lights {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,255,0,0.2) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0,255,0,0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255,0,0,0.2) 0%, transparent 50%);
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Screens */
        #start, #game {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 600px; padding: 25px; background: rgba(0,0,0,0.7);
            border-radius: 18px; text-align: center; box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        h1 {
            margin: 0 0 15px; font-size: 2.2em; color: #ffcc00;
            text-shadow: 0 0 12px #ff0000; letter-spacing: 1px;
        }

        label {
            display: block; margin: 15px 0 5px; font-weight: bold; color: #aaffaa;
        }

        input[type="text"] {
            width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #00cc00;
            border-radius: 10px; background: rgba(255,255,255,0.1); color: #fff;
            font-size: 16px;
        }

        input[readonly] {
            background: rgba(100,100,100,0.3); color: #ffff99; font-size: 12px;
        }

        button {
            margin: 12px 6px; padding: 14px 32px; background: #cc0000; color: #fff;
            border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3); transition: all 0.3s;
        }
        button:hover { background: #ff0000; transform: translateY(-2px); }

        #test-btn { background: #00aa00; }
        #test-btn:hover { background: #00cc00; }

        /* Game Screen */
        #log {
            height: 380px; overflow-y: auto; margin: 15px 0; padding: 15px;
            background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid #00cc00;
            font-size: 1em; line-height: 1.7;
        }

        #msg { width: 68%; padding: 12px; font-size: 16px; }
        #send { width: 28%; padding: 12px; font-size: 16px; }

        /* Fancy Message Bubbles */
        .msg {
            margin: 12px 8px; padding: 12px 16px; border-radius: 16px;
            max-width: 82%; word-wrap: break-word; font-size: 1em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .user {
            background: linear-gradient(135deg, #00c851, #00a13a);
            margin-left: auto; text-align: right; border-bottom-right-radius: 4px;
            color: white;
        }

        .ai {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            margin-right: auto; text-align: left; border-bottom-left-radius: 4px;
            color: white;
        }

        .ai-title {
            font-weight: bold; color: #ffcc00; font-size: 1.1em; margin-bottom: 6px;
            display: block;
        }

        .ai ul {
            margin: 8px 0; padding-left: 20px; list-style: disc;
        }

        .ai li {
            margin: 4px 0; color: #ccffcc;
        }

        .error {
            background: linear-gradient(135deg, #d32f2f, #b71c1c) !important;
            color: #ffff00 !important;
        }

        #stats {
            margin-top: 15px; padding: 12px; background: rgba(0,0,0,0.5);
            border-radius: 10px; font-weight: bold; color: #ffcc00; font-size: 1em;
        }

        #test-result {
            margin: 10px 0; padding: 10px; border-radius: 8px; font-weight: bold; display: none;
        }
        .success { background: #1b5e20; color: #ccffcc; }
        .failure { background: #b71c1c; color: #ffff99; }

        small { font-size: 0.8em; color: #aaaa00; }
        a { color: #00ccff; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="snow"><div class="lights"></div></div>

    <!-- START SCREEN -->
    <div id="start">
        <h1>Christmas Elf RPG</h1>
        <p>It's Christmas Eve! Santa needs <strong>100 gifts</strong> before dawn. <br>Save Christmas!</p>

        <label for="name">Elf Name:</label>
        <input type="text" id="name" placeholder="e.g. Jingle">

        <label for="key">Gemini API Key:</label>
        <input type="text" id="key" placeholder="From aistudio.google.com">

        <label for="proxy">CORS Proxy (POST‑ready):</label>
        <input type="text" id="proxy" readonly value="https://corsproxy.io/?">

        <div id="test-result"></div>

        <p><small>Get key at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></small></p>

        <button id="test-btn" onclick="test()">Test Connection</button>
        <button onclick="start()">Start Adventure</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game" style="display:none">
        <div id="log"></div>
        <input id="msg" placeholder="What do you do?" onkeydown="if(event.key==='Enter')send()">
        <button id="send" onclick="send()">Send</button>
        <div id="stats">Loading...</div>
    </div>

    <script>
        let name, key, proxy, history = [], state = {gifts:0, need:100, energy:100, skill:1, luck:1};

        function test(){
            const k = document.getElementById('key').value.trim();
            if(!k) return showTest('Enter API key!','failure');
            const r = document.getElementById('test-result');
            r.style.display='block'; r.textContent='Testing...'; r.className='';
            const url = `https://corsproxy.io/?${encodeURIComponent('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+k)}`;
            fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Test'}]}]})})
            .then(res=>res.ok?showTest('Connected! Ready!','success'):Promise.reject(res.status))
            .catch(e=>showTest('Failed: '+(e===401?'Bad key':e===429?'Rate limit':e==='TypeError'?'No WiFi':'HTTP '+e),'failure'));
        }
        function showTest(m,t){const r=document.getElementById('test-result');r.textContent=m;r.className=t;}

        function start(){
            name = document.getElementById('name').value.trim();
            key = document.getElementById('key').value.trim();
            proxy = document.getElementById('proxy').value.trim();
            if(!name||!key) return alert('Fill name & key');
            document.getElementById('start').style.display='none';
            document.getElementById('game').style.display='block';

            const init = `You are the Game Master. Player: ${name}. Need ${state.need} gifts.
Respond in this format ONLY:
<span class="ai-title">Quest: [Short title]</span>
[1-2 sentence description]

<span class="ai-title">Action:</span>
1. [Choice 1]
2. [Choice 2]
3. [Choice 3]

[Stats: Energy: X, Skill: Y, Luck: Z | Gifts Made: A/${state.need}]
Keep under 120 words. Start now.`;

            history = [{role:"user",parts:[{text:init}]}];
            call();
        }

        function send(){
            const t = document.getElementById('msg').value.trim();
            if(!t) return;
            add('You: '+t,'user');
            document.getElementById('msg').value='';
            history.push({role:"user",parts:[{text:t}]});
            call();
        }

        function call(){
            add('Thinking...','ai');
            const gemini = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
            const url = `https://corsproxy.io/?${encodeURIComponent(gemini)}`;
            fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:history})})
            .then(r=>r.ok?r.json():Promise.reject(r.status))
            .then(d=>{
                const txt = d.candidates[0].content.parts[0].text;
                rem(); add(formatResponse(txt),'ai');
                history.push({role:"model",parts:[{text:txt}]});
                const m = txt.match(/\[Stats: Energy: (\d+), Skill: (\d+), Luck: (\d+) \| Gifts Made: (\d+)\//);
                if(m){
                    state.energy=+m[1]; state.skill=+m[2]; state.luck=+m[3]; state.gifts=+m[4];
                    document.getElementById('stats').innerHTML = `
                        Energy: <strong>${state.energy}</strong> |
                        Skill: <strong>${state.skill}</strong> |
                        Luck: <strong>${state.luck}</strong> |
                        Gifts: <strong>${state.gifts}/${state.need}</strong>
                    `;
                    if(state.gifts >= state.need){
                        add('<span class="ai-title">CHRISTMAS SAVED!</span><br>All gifts ready! Santa is coming!','ai');
                        document.getElementById('msg').disabled = true;
                    }
                }
            })
            .catch(e=>{rem(); add('Error: '+(e===401?'Bad key':e===429?'Rate limit':e==='TypeError'?'No WiFi':'Error'),'ai error');});
        }

        function formatResponse(text) {
            return text
                .replace(/Quest: /g, '<span class="ai-title">Quest:</span> ')
                .replace(/Action:/g, '<br><span class="ai-title">Action:</span>')
                .replace(/\•/g, '<li>')
                .replace(/(\r\n|\r|\n)/g, '<br>')
                .replace(/<li>/g, '</li><li>')
                .replace(/<\/li><li>$/, '</li>')
                .replace(/^(.*)<br>$/, '$1');
        }

        function add(t,c){
            const d = document.createElement('div');
            d.className = 'msg ' + c;
            d.innerHTML = t;
            document.getElementById('log').appendChild(d);
            d.scrollIntoView({behavior:'smooth'});
        }
        function rem(){
            const l = document.getElementById('log');
            if(l.lastChild && l.lastChild.textContent === 'Thinking...') l.removeChild(l.lastChild);
        }
    </script>
</body>
</html>
