<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Elf RPG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            background-color: #0a0a2a; /* Dark night sky */
            overflow: hidden;
        }

        /* Animated holiday background: Snowflakes and twinkling lights */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.5"/></svg>') repeat;
            animation: snowfall 10s linear infinite;
            z-index: -1;
        }

        @keyframes snowfall {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* Twinkling lights */
        .lights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,0,0.1) 0%, transparent 70%);
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #start-screen, #game-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            max-width: 600px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
        }

        #chat-log {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }

        #user-input {
            width: 80%;
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #cc0000;
        }

        .message {
            margin-bottom: 10px;
        }

        .user-message {
            text-align: right;
            color: #00ff00;
        }

        .ai-message {
            text-align: left;
            color: #ffffff;
        }

        #stats {
            margin-top: 10px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="lights"></div>
    </div>

    <div id="start-screen">
        <h1>Christmas Elf RPG</h1>
        <p>Welcome to the North Pole! It's Christmas Eve, and you're an elf behind on gift production. Help Santa by completing quests and tasks to make all the gifts in time!</p>
        <label for="elf-name">Enter your Elf Name:</label><br>
        <input type="text" id="elf-name" placeholder="Elf Name"><br><br>
        <label for="api-key">Enter your Google Gemini API Key:</label><br>
        <input type="text" id="api-key" placeholder="API Key"><br><br>
        <button onclick="startGame()">Start Adventure</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div id="chat-log"></div>
        <input type="text" id="user-input" placeholder="What do you do next?">
        <button onclick="sendMessage()">Send</button>
        <div id="stats">Stats: Loading...</div>
    </div>

    <script>
        let elfName = '';
        let apiKey = '';
        let conversationHistory = [];
        let gameState = {
            giftsMade: 0,
            requiredGifts: 100, // Example goal
            stats: {
                energy: 100,
                skill: 1,
                luck: 1
            }
        };

        function startGame() {
            elfName = document.getElementById('elf-name').value.trim();
            apiKey = document.getElementById('api-key').value.trim();

            if (!elfName || !apiKey) {
                alert('Please enter your elf name and API key!');
                return;
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // Initial prompt to Gemini
            const initialPrompt = `You are the Game Master for a text-based Christmas Elf RPG. The player is an elf named ${elfName} on Christmas Eve at the North Pole. They are behind schedule and need to make ${gameState.requiredGifts} gifts before dawn to save Christmas. The game involves quests, storylines, challenges, and tasks like crafting, gathering materials, helping other elves, fighting minor obstacles (like mischievous reindeer or toy malfunctions), and more. 

Track and update these stats after each response: Energy (starts at 100, decreases with actions, rest to recover), Skill (starts at 1, increases with successful tasks), Luck (starts at 1, increases with lucky events). Also track gifts made (starts at 0, goal ${gameState.requiredGifts}).

Respond only in narrative text, describing the scene, outcomes, and presenting choices or asking for next action. End each response with current stats and gifts progress, like: 
[Stats: Energy: X, Skill: Y, Luck: Z | Gifts Made: A/${gameState.requiredGifts}]

If gifts reach ${gameState.requiredGifts}, end the game with a victory message. Make it fun, holiday-themed, and engaging. Keep responses concise (under 200 words).

Start the game: Introduce the scenario and first quest.`;

            conversationHistory.push({ role: 'user', parts: [{ text: initialPrompt }] });
            callGemini();
        }

        function sendMessage() {
            const userInput = document.getElementById('user-input').value.trim();
            if (!userInput) return;

            appendMessage('You: ' + userInput, 'user-message');
            document.getElementById('user-input').value = '';

            // Add to history
            conversationHistory.push({ role: 'user', parts: [{ text: userInput }] });

            callGemini();
        }

        function callGemini() {
            appendMessage('Thinking...', 'ai-message'); // Placeholder

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
            const body = {
                contents: conversationHistory,
                generationConfig: {
                    temperature: 0.9,
                    topK: 1,
                    topP: 1,
                    maxOutputTokens: 2048,
                },
                safetySettings: [
                    { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_MEDIUM_AND_ABOVE' },
                    { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_MEDIUM_AND_ABOVE' },
                    { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_MEDIUM_AND_ABOVE' },
                    { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_MEDIUM_AND_ABOVE' }
                ]
            };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(response => response.json())
            .then(data => {
                const aiResponse = data.candidates[0].content.parts[0].text;
                // Remove placeholder
                const chatLog = document.getElementById('chat-log');
                chatLog.removeChild(chatLog.lastChild);

                appendMessage(aiResponse, 'ai-message');

                // Add to history
                conversationHistory.push({ role: 'model', parts: [{ text: aiResponse }] });

                // Parse and update game state (simple regex for stats)
                const statsMatch = aiResponse.match(/\[Stats: Energy: (\d+), Skill: (\d+), Luck: (\d+) \| Gifts Made: (\d+)\/\d+\]/);
                if (statsMatch) {
                    gameState.stats.energy = parseInt(statsMatch[1]);
                    gameState.stats.skill = parseInt(statsMatch[2]);
                    gameState.stats.luck = parseInt(statsMatch[3]);
                    gameState.giftsMade = parseInt(statsMatch[4]);
                    updateStats();

                    if (gameState.giftsMade >= gameState.requiredGifts) {
                        appendMessage('Congratulations! All gifts are made. Christmas is saved!', 'ai-message');
                        document.getElementById('user-input').disabled = true;
                        document.querySelector('#game-screen button').disabled = true;
                    }
                }
            })
            .catch(error => {
                appendMessage('Error: Could not connect to Gemini. Check API key or network.', 'ai-message');
                console.error(error);
            });
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.textContent = text;
            document.getElementById('chat-log').appendChild(div);
            div.scrollIntoView();
        }

        function updateStats() {
            document.getElementById('stats').textContent = `Stats: Energy: ${gameState.stats.energy}, Skill: ${gameState.stats.skill}, Luck: ${gameState.stats.luck} | Gifts Made: ${gameState.giftsMade}/${gameState.requiredGifts}`;
        }
    </script>
</body>
</html>
