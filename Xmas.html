<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Elf RPG – Gemini 2.5 Flash</title>

    <!-- Full CSS Styling -->
    <style>
        /* Page background and layout */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background-color: #0a0a2a;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Animated snowfall background */
        .snowfall-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.6"/></svg>') repeat;
            animation: snowfall-animation 12s linear infinite;
            z-index: -1;
        }

        @keyframes snowfall-animation {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* Twinkling Christmas lights */
        .christmas-lights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 0, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0, 255, 0, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 0, 0, 0.2) 0%, transparent 50%);
            animation: twinkle-animation 3s infinite alternate;
        }

        @keyframes twinkle-animation {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Start and Game Screens */
        #start-screen, #game-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Title */
        h1 {
            margin: 0 0 15px;
            font-size: 2em;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff0000;
        }

        /* Paragraphs */
        p {
            margin: 10px 0;
            line-height: 1.5;
        }

        /* Labels */
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #aaffaa;
        }

        /* Text inputs */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #00cc00;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        input[readonly] {
            background: rgba(100, 100, 100, 0.3);
            color: #ffff99;
            font-size: 12px;
        }

        /* Buttons */
        button {
            margin: 10px 5px;
            padding: 12px 30px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background: #ff0000;
            transform: scale(1.05);
        }

        #test-connection-button {
            background: #00aa00;
        }

        #test-connection-button:hover {
            background: #00cc00;
        }

        /* Chat log */
        #chat-log {
            height: 380px;
            overflow-y: auto;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid #00cc00;
            font-size: 1em;
            line-height: 1.6;
        }

        /* User input and send button */
        #user-input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
        }

        #send-button {
            width: 25%;
            padding: 12px;
            font-size: 16px;
        }

        /* Message bubbles */
        .message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .user-message {
            background: rgba(0, 200, 0, 0.3);
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 0;
        }

        .ai-message {
            background: rgba(0, 100, 200, 0.3);
            margin-right: auto;
            text-align: left;
            border-bottom-left-radius: 0;
        }

        .error-message {
            background: rgba(200, 0, 0, 0.5) !important;
            color: #ffff00;
        }

        /* Stats display */
        #stats-display {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-weight: bold;
            color: #ffcc00;
        }

        /* Test result box */
        #test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }

        .success-result {
            background: rgba(0, 170, 0, 0.5);
            color: #fff;
        }

        .failure-result {
            background: rgba(200, 0, 0, 0.5);
            color: #ffff00;
        }

        /* Small text */
        small {
            font-size: 0.8em;
            color: #aaaa00;
        }

        /* Links */
        a {
            color: #00ccff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="snowfall-background">
        <div class="christmas-lights"></div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>Christmas Elf RPG</h1>
        <p>It's Christmas Eve at the North Pole, and you're <strong>way behind schedule</strong>! Santa needs <strong>100 gifts</strong> ready before dawn. Can you save Christmas?</p>

        <label for="elf-name-input">Your Elf Name:</label>
        <input type="text" id="elf-name-input" placeholder="e.g. Sparkle, Jingle, Frosty">

        <label for="api-key-input">Google Gemini API Key:</label>
        <input type="text" id="api-key-input" placeholder="Get free at aistudio.google.com">

        <label for="proxy-url-input">CORS Proxy URL (POST‑ready):</label>
        <input type="text" id="proxy-url-input" readonly 
               value="https://corsproxy.io/?">

        <div id="test-result"></div>

        <p><small><strong>Tip:</strong> Get your API key at 
            <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
        </small></p>

        <button id="test-connection-button" onclick="testConnection()">Test Connection</button>
        <button onclick="startGame()">Start Adventure</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" style="display: none;">
        <div id="chat-log"></div>
        <input type="text" id="user-input" placeholder="What do you do next?" 
               onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="send-button" onclick="sendMessage()">Send</button>
        <div id="stats-display">Loading stats...</div>
    </div>

    <!-- FULL JAVASCRIPT LOGIC -->
    <script>
        // Game state variables
        let elfName = '';
        let apiKey = '';
        let proxyUrl = '';
        let conversationHistory = [];
        let gameState = {
            giftsMade: 0,
            requiredGifts: 100,
            stats: {
                energy: 100,
                skill: 1,
                luck: 1
            }
        };

        // Test connection to Gemini via proxy
        function testConnection() {
            const testKey = document.getElementById('api-key-input').value.trim();
            if (!testKey) {
                showTestResult('Please enter your API key first!', 'failure-result');
                return;
            }

            const testResultElement = document.getElementById('test-result');
            testResultElement.style.display = 'block';
            testResultElement.textContent = 'Testing connection...';
            testResultElement.className = '';

            const geminiTestUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${testKey}`;
            const fullProxyUrl = `https://corsproxy.io/?${encodeURIComponent(geminiTestUrl)}`;

            fetch(fullProxyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: 'Test' }] }]
                })
            })
            .then(response => {
                if (response.ok) {
                    showTestResult('Connected! Gemini 2.5 Flash is ready.', 'success-result');
                } else {
                    return response.text().then(text => { throw new Error(`HTTP ${response.status}: ${text}`); });
                }
            })
            .catch(error => {
                let message = 'Connection failed: ';
                if (error.message.includes('401') || error.message.includes('400')) {
                    message += 'Invalid API key. Regenerate it.';
                } else if (error.message.includes('429')) {
                    message += 'Rate limit reached. Wait 1 minute.';
                } else if (error.name === 'TypeError') {
                    message += 'No internet or browser blocked request. Try incognito.';
                } else {
                    message += error.message;
                }
                showTestResult(message, 'failure-result');
            });
        }

        function showTestResult(message, className) {
            const resultElement = document.getElementById('test-result');
            resultElement.textContent = message;
            resultElement.className = className;
        }

        // Start the game
        function startGame() {
            elfName = document.getElementById('elf-name-input').value.trim();
            apiKey = document.getElementById('api-key-input').value.trim();
            proxyUrl = document.getElementById('proxy-url-input').value.trim();

            if (!elfName || !apiKey) {
                alert('Please enter your elf name and API key!');
                return;
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // Initial system prompt
            const initialPrompt = `You are the Game Master for a text-based Christmas Elf RPG. 
The player is an elf named ${elfName} at the North Pole on Christmas Eve. 
They are behind schedule and must produce ${gameState.requiredGifts} gifts before Santa leaves.

Track these stats:
- Energy (starts at 100, decreases with actions, recover by resting)
- Skill (starts at 1, increases with successful crafting/quests)
- Luck (starts at 1, increases with lucky events)

Also track: Gifts Made (0 / ${gameState.requiredGifts})

Respond in immersive, holiday-themed narrative. Present choices, challenges, and quests. 
Keep responses under 200 words. End EVERY reply with:

[Stats: Energy: X, Skill: Y, Luck: Z | Gifts Made: A/${gameState.requiredGifts}]

If Gifts Made reaches ${gameState.requiredGifts}, end with a victory message.

Begin the adventure now.`;

            conversationHistory = [
                { role: 'user', parts: [{ text: initialPrompt }] }
            ];

            callGemini();
        }

        // Send player message
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            appendMessage('You: ' + message, 'user-message');
            inputField.value = '';

            conversationHistory.push({ role: 'user', parts: [{ text: message }] });
            callGemini();
        }

        // Call Gemini via proxy
        function callGemini() {
            appendMessage('Thinking...', 'ai-message');

            const geminiApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const fullProxyUrl = `https://corsproxy.io/?${encodeURIComponent(geminiApiUrl)}`;

            fetch(fullProxyUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: conversationHistory,
                    generationConfig: {
                        temperature: 0.9,
                        maxOutputTokens: 2048
                    }
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(`HTTP ${response.status}: ${text}`); });
                }
                return response.json();
            })
            .then(data => {
                const aiResponse = data.candidates[0].content.parts[0].text;
                removeThinkingMessage();
                appendMessage(aiResponse, 'ai-message');
                conversationHistory.push({ role: 'model', parts: [{ text: aiResponse }] });

                // Parse stats from AI response
                const statsMatch = aiResponse.match(/\[Stats: Energy: (\d+), Skill: (\d+), Luck: (\d+) \| Gifts Made: (\d+)\/\d+\]/);
                if (statsMatch) {
                    gameState.stats.energy = parseInt(statsMatch[1]);
                    gameState.stats.skill = parseInt(statsMatch[2]);
                    gameState.stats.luck = parseInt(statsMatch[3]);
                    gameState.giftsMade = parseInt(statsMatch[4]);
                    updateStatsDisplay();

                    if (gameState.giftsMade >= gameState.requiredGifts) {
                        setTimeout(() => {
                            appendMessage('CHRISTMAS IS SAVED! All gifts are ready! SANTA IS COMING!', 'ai-message');
                            document.getElementById('user-input').disabled = true;
                            document.getElementById('send-button').disabled = true;
                        }, 500);
                    }
                }
            })
            .catch(error => {
                removeThinkingMessage();
                let errorMessage = 'Error: ';
                if (error.message.includes('401') || error.message.includes('400')) {
                    errorMessage += 'Invalid API key. Please regenerate it.';
                } else if (error.message.includes('429')) {
                    errorMessage += 'Rate limit reached. Please wait 1 minute.';
                } else if (error.name === 'TypeError') {
                    errorMessage += 'Network error. Check WiFi, disable VPN, or try incognito mode.';
                } else {
                    errorMessage += error.message;
                }
                appendMessage(errorMessage, 'ai-message error-message');
                console.error('Gemini API Error:', error);
            });
        }

        // Append message to chat log
        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + className;
            messageDiv.textContent = text;
            document.getElementById('chat-log').appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // Remove "Thinking..." placeholder
        function removeThinkingMessage() {
            const chatLog = document.getElementById('chat-log');
            const lastMessage = chatLog.lastChild;
            if (lastMessage && lastMessage.textContent === 'Thinking...') {
                chatLog.removeChild(lastMessage);
            }
        }

        // Update stats display
        function updateStatsDisplay() {
            document.getElementById('stats-display').textContent = 
                `Energy: ${gameState.stats.energy} | Skill: ${gameState.stats.skill} | Luck: ${gameState.stats.luck} | Gifts: ${gameState.giftsMade}/${gameState.requiredGifts}`;
        }
    </script>
</body>
</html>
